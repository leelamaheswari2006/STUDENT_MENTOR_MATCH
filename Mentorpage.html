<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentor Page</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { background-color: #f4f4f4; }
.dashboard-card { transition: transform 0.3s; }
.dashboard-card:hover { transform: scale(1.05); }
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand">Mentor Dashboard</span>
  <a href="login.html" class="btn btn-danger">Logout</a>
</nav>
<div class="container mt-5">
  <h2 class="text-center mb-4">Welcome, Mentor!</h2>
  <div class="row text-center">
    <div class="col-md-4">
      <div class="card dashboard-card p-4 shadow-sm">
        <i class="fas fa-user fa-3x text-primary"></i>
        <h5 class="mt-3">Profile</h5>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card dashboard-card p-4 shadow-sm">
        <i class="fas fa-chart-line fa-3x text-success"></i>
        <h5 class="mt-3">Student Analytics</h5>
        <a href="mentor/pending" class="btn btn-primary mt-2">View Requests</a>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card dashboard-card p-4 shadow-sm">
        <i class="fas fa-cog fa-3x text-warning"></i>
        <h5 class="mt-3">Settings</h5>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
